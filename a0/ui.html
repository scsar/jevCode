<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JevCode 리뷰</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --line: #e3e2de; --text: #1f1f1d; --muted: #6b6a66;
    --accent: #2f5bd3; --ok: #1f7a4c; --bad: #b3261e; --warn: #9a6200; --soft: #f0efeb;
    --add-bg: #e8f5ec; --del-bg: #fbeaea; --hunk: #eef1fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --line: #33322f; --text: #ecebe7; --muted: #9c9a94;
      --accent: #7c9cf5; --ok: #5cc28c; --bad: #f0857c; --warn: #e0b04d; --soft: #292826;
      --add-bg: #173323; --del-bg: #3a1c1a; --hunk: #22283a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", "Malgun Gothic", system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  .pill { padding: 2px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); font-size: 12px; white-space: nowrap; }
  .pill b { color: var(--text); }
  .spacer { flex: 1; }
  button, select, textarea, input { font: inherit; color: inherit; }
  button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.sel-ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.sel-bad { background: var(--bad); border-color: var(--bad); color: #fff; }
  button.sel { background: var(--text); border-color: var(--text); color: var(--panel); }
  main { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; min-height: calc(100vh - 53px); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  #list { border-right: 1px solid var(--line); overflow-y: auto; max-height: calc(100vh - 53px); }
  .filters { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); }
  .item { padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover { background: var(--soft); }
  .item.active { background: var(--soft); box-shadow: inset 3px 0 0 var(--accent); }
  .item .task { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .meta { color: var(--muted); font-size: 12px; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .badge { font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); white-space: nowrap; }
  .b-ok { color: var(--ok); border-color: var(--ok); }
  .b-bad { color: var(--bad); border-color: var(--bad); }
  .b-warn { color: var(--warn); border-color: var(--warn); }
  .b-muted { color: var(--muted); }
  #detail { padding: 16px 20px 60px; overflow-y: auto; max-height: calc(100vh - 53px); }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
  section h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .label { color: var(--muted); min-width: 70px; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.45 Consolas, "D2Coding", monospace; }
  .scroll { max-height: 420px; overflow: auto; background: var(--soft); border-radius: 6px; padding: 8px; }
  .diff .add { background: var(--add-bg); } .diff .del { background: var(--del-bg); } .diff .hunk { background: var(--hunk); color: var(--muted); }
  .diff .file { font-weight: 700; margin-top: 8px; }
  .assume { border-left: 3px solid var(--accent); padding: 4px 10px; background: var(--soft); border-radius: 4px; }
  .warn-box { border: 1px solid var(--bad); border-radius: 6px; padding: 8px 10px; margin: 6px 0; color: var(--bad); }
  .warn-box table { color: var(--text); }
  .file-row { cursor: pointer; }
  .file-row:hover td { background: var(--soft); }
  .file-row.sel td { background: var(--soft); font-weight: 600; }
  .file-row.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td, th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .claim { border-left: 3px solid var(--warn); padding-left: 10px; }
  textarea { width: 100%; min-height: 60px; border: 1px solid var(--line); border-radius: 6px; padding: 6px; background: var(--bg); }
  select { border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: var(--bg); }
  .reviewbox { border-color: var(--accent); }
  .checklist { margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .checklist label { display: flex; gap: 8px; align-items: flex-start; margin: 4px 0; cursor: pointer; }
  .checklist input { margin-top: 3px; }
  .hint { color: var(--muted); font-size: 12px; }
  .done { color: var(--ok); font-weight: 600; }
  dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); max-width: 760px; width: 92vw; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .kpi div { background: var(--soft); border-radius: 8px; padding: 10px; }
  .kpi b { display: block; font-size: 20px; }
  .kpi .goal { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>JevCode 리뷰</h1>
  <span class="pill">대기 <b id="pendingCount">-</b></span>
  <span class="pill">실행 <b id="runCount">-</b></span>
  <span class="spacer"></span>
  <button id="bypassBtn" title="jevcode를 거치지 않고 실행기를 직접 쓴 경우 기록">직접 사용 기록</button>
  <button id="statsBtn">지표</button>
  <button id="reloadBtn">새로고침</button>
</header>
<main>
  <div id="list">
    <div class="filters">
      <button data-filter="pending" class="sel">리뷰 대기</button>
      <button data-filter="all">전체</button>
    </div>
    <div id="items"></div>
  </div>
  <div id="detail"><div class="empty">왼쪽에서 실행을 선택하세요.</div></div>
</main>

<dialog id="statsDialog"><div id="statsBody"></div><div class="row" style="justify-content:flex-end"><button onclick="this.closest('dialog').close()">닫기</button></div></dialog>
<dialog id="bypassDialog">
  <h3 style="margin-top:0">직접 사용 기록</h3>
  <p class="hint">jevcode 없이 Codex나 Claude를 직접 쓴 작업을 남깁니다. A0의 우회 비율 지표에 들어갑니다.</p>
  <textarea id="bypassNote" placeholder="이유 (예: 긴 대화형 디버깅이라 직접 씀)"></textarea>
  <div class="row" style="justify-content:flex-end; margin-top:8px"><button onclick="this.closest('dialog').close()">취소</button><button class="primary" id="bypassSave">기록</button></div>
</dialog>

<script>
const token = new URLSearchParams(location.search).get('t');
const api = async (path, opts = {}) => {
  const res = await fetch(path, { ...opts, headers: { 'x-jevcode-token': token, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.status);
  return res.json();
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = (x) => (x == null ? '-' : `${Math.round(x * 100)}%`);
const num = (n) => (n == null ? '-' : n.toLocaleString('ko-KR'));
const when = (iso) => (iso ? new Date(iso).toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }) : '-');
const secs = (ms) => (ms == null ? '-' : ms >= 60000 ? `${Math.floor(ms / 60000)}분 ${Math.round((ms % 60000) / 1000)}초` : `${Math.round(ms / 1000)}초`);

const OUTCOME = { completed: ['완료', 'b-ok'], failed: ['실패', 'b-bad'], timed_out: ['시간초과', 'b-bad'], cancelled: ['취소', 'b-warn'], unknown: ['불명', 'b-bad'], quota_exhausted: ['한도소진', 'b-warn'] };
const VERIFY = { passed: ['검증 통과', 'b-ok'], failed: ['검증 실패', 'b-bad'], skipped: ['검증 없음', 'b-muted'], unknown: ['검증 불명', 'b-warn'] };
const badge = ([text, cls]) => `<span class="badge ${cls}">${esc(text)}</span>`;
const PRIORITY = ['가볍게', '보통', '꼼꼼히'];

let meta = { causes: [], causeText: {} };
let runs = [];
let filter = 'pending';
let current = null;
let openedAt = 0;

async function loadList(selectId) {
  runs = await api('/api/runs');
  const pending = runs.filter((r) => !r.review);
  document.getElementById('pendingCount').textContent = pending.length;
  document.getElementById('runCount').textContent = runs.length;
  const shown = filter === 'pending' ? pending : runs;
  document.getElementById('items').innerHTML = shown.length ? shown.map((r) => {
    const reviewed = (r.review ? badge(r.review.decision === 'accepted' ? ['수락', 'b-ok'] : ['거절', 'b-bad']) : '')
      + (r.commit ? badge([`커밋 ${r.commit.sha.slice(0, 7)}`, 'b-ok']) : '')
      + (r.reverted ? badge(['되돌림', 'b-muted']) : '')
      + (r.humanTasks && !r.review ? badge(['사람이 할 일', 'b-warn']) : '');
    const pr = r.shadow.jev?.answers?.review_priority?.value ?? r.shadow.rules?.answers?.review_priority?.value;
    return `<div class="item ${current === r.id ? 'active' : ''}" data-id="${esc(r.id)}">
      <div class="task">${esc(r.task)}</div>
      <div class="meta">${badge(OUTCOME[r.executionOutcome] || [r.executionOutcome, 'b-muted'])}${badge(VERIFY[r.verificationStatus] || [r.verificationStatus, 'b-muted'])}
        ${r.policyStatus === 'violated' ? badge(['정책 위반', 'b-bad']) : ''}${reviewed}
        <span>${esc(r.repo)}</span>${r.tag ? `<span>#${esc(r.tag)}</span>` : ''}<span>${r.files}파일</span>
        ${pr != null && r.review ? `<span title="shadow 판단 리뷰 우선순위">◆${PRIORITY[Math.round(pr)] || pr}</span>` : ''}
      </div></div>`;
  }).join('') : `<div class="empty">${filter === 'pending' ? '리뷰할 실행이 없습니다.' : '실행 기록이 없습니다.'}</div>`;
  document.querySelectorAll('.item').forEach((el) => el.onclick = () => openRun(el.dataset.id));
  if (selectId) openRun(selectId);
}

// Splits a unified patch into per-file chunks keyed by the post-change path (pre-change for deletions).
function splitPatch(patch) {
  const chunks = new Map();
  if (!patch) return chunks;
  const unquote = (p) => p.replace(/^"|"$/g, '');
  let path = null;
  let lines = [];
  const flush = () => { if (path) chunks.set(path, lines.join('\n')); };
  for (const line of patch.split('\n')) {
    const header = line.match(/^diff --git "?a\/(.*?)"? "?b\/(.*?)"?$/);
    if (header) { flush(); path = unquote(header[2]); lines = [line]; continue; }
    if (path) lines.push(line);
  }
  flush();
  return chunks;
}

// xUnit tests touched by the run: added/changed ([Fact]/[Theory] + method on added lines) and removed.
function extractTests(chunks) {
  const out = [];
  for (const [file, chunk] of chunks) {
    if (!/tests?[\\/]|tests?\.cs$/i.test(file) || !file.endsWith('.cs')) continue;
    let attr = null;
    for (const raw of chunk.split('\n')) {
      if (/^(diff --git|index |--- |\+\+\+ |@@)/.test(raw)) continue;
      const sign = raw[0] === '+' || raw[0] === '-' ? raw[0] : ' ';
      const line = raw.slice(1).trim();
      const a = line.match(/^\[(Fact|Theory)\b/);
      if (a) { attr = { kind: a[1], sign, cases: 0 }; continue; }
      if (attr && /^\[InlineData\b/.test(line)) { attr.cases++; continue; }
      const m = attr && line.match(/^(?:public\s+)?(?:async\s+)?(?:void|Task)\s+(\w+)\s*\(/);
      if (m) {
        const change = sign === '-' ? 'removed' : sign === '+' || attr.sign === '+' ? 'added' : null;
        if (change) out.push({ file, name: m[1], kind: attr.kind, cases: attr.cases, change });
        attr = null;
      } else if (attr && line && !line.startsWith('[')) attr = null;
    }
  }
  return out;
}

// Pulls a section out of the agent's final message. Handles a heading with a body below
// ("### 가정" / "**가정**" + list) and the inline form ("**가정:** text", "가정: text").
function extractSection(message, title) {
  const lines = (message || '').split('\n');
  const heading = new RegExp(`^\\s*(#{1,6}\\s*)?\\**${title}\\**\\s*:?\\s*\\**\\s*$`);
  const inline = new RegExp(`^\\s*[-*>]*\\s*\\**${title}\\s*:\\s*\\**\\s*(.+)$`);
  const stop = (l) => /^\s*#{1,6}\s/.test(l) || /^\s*[`*>-]*\s*Commit:/i.test(l);
  for (let i = 0; i < lines.length; i++) {
    if (heading.test(lines[i])) {
      const body = [];
      for (const l of lines.slice(i + 1)) { if (stop(l)) break; body.push(l); }
      const text = body.join('\n').trim();
      if (text) return text;
    }
    const m = lines[i].match(inline);
    if (m) {
      // Inline form: this line plus any directly following non-blank lines.
      const body = [m[1]];
      for (const l of lines.slice(i + 1)) { if (!l.trim() || stop(l)) break; body.push(l); }
      return body.join('\n').trim();
    }
  }
  return null;
}

// Changed existing files first (they carry the risk), then deletions, then new files; original indexes.
function deltaOrder(delta) {
  const rank = (s) => (s.startsWith('M') || s.startsWith('R') ? 0 : s.startsWith('D') ? 1 : 2);
  return delta.map((d, i) => i).sort((a, b) => rank(delta[a].status) - rank(delta[b].status) || a - b);
}

// Public API lines added/removed in non-test C# files, grouped per member: added, changed, removed.
function extractPublicApi(chunks) {
  const members = new Map();
  for (const [file, chunk] of chunks) {
    if (!file.endsWith('.cs') || /tests?[\\/]/i.test(file)) continue;
    for (const raw of chunk.split('\n')) {
      if (!/^[+-]/.test(raw) || /^(\+\+\+|---) /.test(raw)) continue;
      const line = raw.slice(1).trim();
      if (!/^public\b/.test(line)) continue;
      const type = line.match(/\b(class|record|struct|interface|enum)\s+(\w+)/);
      const call = line.match(/(\w+)\s*(<[^>]*>)?\s*\(/);
      const member = line.match(/(\w+)\s*(\{|=>|=|;)/);
      const name = type ? type[2] : call ? call[1] : member ? member[1] : null;
      if (!name) continue;
      const key = `${file}|${name}`;
      const entry = members.get(key) || { file, name, signature: '', added: false, removed: false };
      if (raw[0] === '+') { entry.added = true; entry.signature = line.split(/\s*(\{|=>)/)[0].slice(0, 120); } else { entry.removed = true; if (!entry.signature) entry.signature = line.split(/\s*(\{|=>)/)[0].slice(0, 120); }
      members.set(key, entry);
    }
  }
  const all = [...members.values()];
  return {
    added: all.filter((m) => m.added && !m.removed),
    changed: all.filter((m) => m.added && m.removed),
    removed: all.filter((m) => !m.added && m.removed),
  };
}

function renderReviewPoints(run, chunks, twins = []) {
  const assumptions = extractSection(run.lastMessage, '가정');
  // Existing code the result depends on but the run did not change (the diff cannot show it).
  const relied = extractSection(run.lastMessage, '의존한 기존 코드');
  const proposals = extractSection(run.lastMessage, '제안');
  const behavior = extractSection(run.lastMessage, '기존 동작 변경');
  const api = extractPublicApi(chunks);
  const apiRows = (items) => `<table>${items.map((m) => `<tr><td><code>${esc(m.signature)}</code></td><td class="hint">${esc(m.file.split('/').pop())}</td></tr>`).join('')}</table>`;
  const behaviorBlock = behavior == null
    ? '<p class="hint">섹션 없음 (AGENTS.md 규칙 추가 전 run이거나 누락)</p>'
    : /^\s*(없음|none|n\/a)\.?\s*$/i.test(behavior)
      ? '<p class="done">없음 — 기존 동작은 그대로다</p>'
      : `<div class="warn-box" style="color:var(--text); border-color:var(--warn)"><pre>${esc(behavior)}</pre></div>`;
  const tests = extractTests(chunks);
  const added = tests.filter((t) => t.change === 'added');
  const removed = tests.filter((t) => t.change === 'removed');
  const testList = (items) => `<table>${items.map((t) => `<tr><td>${esc(t.name)}${t.kind === 'Theory' ? ` <span class="hint">(Theory${t.cases ? `, ${t.cases}케이스` : ''})</span>` : ''}</td><td class="hint">${esc(t.file.split('/').pop())}</td></tr>`).join('')}</table>`;
  const human = extractSection(run.lastMessage, '사람이 할 일');
  // Commands the agent wants a human to run: `inline` spans and fenced blocks, offered for copying only.
  // Fenced blocks always count; inline spans only when they contain a space (a path alone is not a command).
  const commands = human
    ? [...human.matchAll(/```[a-z]*\n([\s\S]*?)```/g)].map((m) => m[1].trim())
      .concat([...human.replace(/```[\s\S]*?```/g, '').matchAll(/`([^`\n]+)`/g)].map((m) => m[1]).filter((c) => /\s/.test(c.trim())))
    : [];
  const humanBlock = human ? `<div class="warn-box" style="color:var(--text); border-color:var(--warn)">
      <b>⚠ 사람이 할 일</b> <span class="hint">판정·커밋 전에 처리했는지 확인</span>
      <pre style="margin-top:6px">${esc(human)}</pre>
      ${commands.length ? `<table style="margin-top:6px">${commands.map((c, i) => `<tr><td><code>${esc(c)}</code></td><td style="width:60px"><button class="copy-cmd" data-cmd="${i}">복사</button></td></tr>`).join('')}</table>
      <div class="hint">명령은 복사만 됩니다. 실행은 직접 터미널에서.</div>` : ''}
    </div>` : '';
  renderReviewPoints.lastCommands = commands;
  const twinBlock = twins.length ? `<div class="warn-box"><b>⚠ 이전에 거절된 run과 같은 명령</b> — 예전 명령을 다시 붙여 넣은 것일 수 있습니다.<table>${twins.map((t) => `<tr><td><code>${esc(t.id)}</code></td><td>${esc(t.cause || '-')}</td><td class="hint">${esc(t.reason.replace(/\s+/g, ' ').slice(0, 160))}</td></tr>`).join('')}</table></div>` : '';
  return `<section class="points"><h2>리뷰 요점</h2>
    ${twinBlock}
    ${humanBlock}
    <div class="row"${human ? ' style="margin-top:10px"' : ''}><b>기존 동작 변경</b><span class="hint">가장 위험한 부분. "없음"이면 새 코드만 추가된 것</span></div>
    ${behaviorBlock}
    <div class="row" style="margin-top:10px"><b>의존한 기존 코드</b><span class="hint">이번에 바꾸지 않았지만 결과를 좌우하는 코드. diff에 안 보이는 원인이 여기 있다</span></div>
    ${relied == null ? '<p class="hint">섹션 없음 (AGENTS.md 규칙 추가 전 run이거나 누락)</p>' : `<div class="assume"><pre>${esc(relied)}</pre></div>`}
    <div class="row" style="margin-top:10px"><b>공개 API</b><span class="hint">다른 코드가 쓰게 될 이름과 모양</span></div>
    ${api.removed.length ? `<div class="warn-box"><b>⚠ 삭제된 공개 API ${api.removed.length}개</b> — 다른 코드가 쓰고 있지 않은지 확인하세요.${apiRows(api.removed)}</div>` : ''}
    ${api.changed.length ? `<div class="hint">변경 ${api.changed.length}개</div>${apiRows(api.changed)}` : ''}
    ${api.added.length ? `<div class="hint">추가 ${api.added.length}개</div>${apiRows(api.added)}` : ''}
    ${api.added.length + api.changed.length + api.removed.length ? '' : '<p class="hint">공개 API 변화 없음</p>'}
    <div class="row" style="margin-top:10px"><b>가정</b><span class="hint">실행기가 임의로 정한 부분. 기획과 맞는지 판단할 곳</span></div>
    ${assumptions ? `<div class="assume"><pre>${esc(assumptions)}</pre></div>` : '<p class="hint">가정 섹션 없음</p>'}
    ${proposals ? `<div class="row" style="margin-top:10px"><b>제안</b><span class="hint">범위 밖이라 고치지 않은 것. 다음 run 후보</span></div><div class="assume"><pre>${esc(proposals)}</pre></div>` : ''}
    <div class="row" style="margin-top:10px"><b>테스트</b><span class="hint">이름이 곧 동작 명세. 요청한 규칙을 다 덮는지 확인</span></div>
    ${removed.length ? `<div class="warn-box"><b>⚠ 삭제되거나 이름이 바뀐 테스트 ${removed.length}개</b> — 통과시키려고 테스트를 지운 건 아닌지 확인하세요.${testList(removed)}</div>` : ''}
    ${added.length ? `<div class="hint">추가·변경 ${added.length}개</div>${testList(added)}` : '<p class="hint">추가·변경된 테스트 없음</p>'}
  </section>`;
}

function renderDiff(patch) {
  if (!patch) return '<span class="hint">변경 없음 또는 diff 파일 없음</span>';
  return `<div class="scroll diff"><pre>${patch.split('\n').map((l) => {
    const cls = l.startsWith('diff --git') ? 'file' : l.startsWith('@@') ? 'hunk' : l.startsWith('+') && !l.startsWith('+++') ? 'add' : l.startsWith('-') && !l.startsWith('---') ? 'del' : '';
    return `<div class="${cls}">${esc(l) || ' '}</div>`;
  }).join('')}</pre></div>`;
}

// Latest successful answer per provider; an error is shown only when a provider never succeeded.
function latestPerProvider(decisions) {
  const byProvider = new Map();
  for (const d of decisions) {
    const prev = byProvider.get(d.provider);
    if (!prev || !d.error || prev.error) byProvider.set(d.provider, d);
  }
  return [...byProvider.values()];
}

function renderDecision(d) {
  if (d.error) return `<tr><td>${esc(d.provider)}</td><td colspan="3" class="hint">오류: ${esc(d.error)}</td><td>${esc(when(d.at))}</td></tr>`;
  const a = d.answers || {};
  const p = a.review_priority?.value;
  const c = a.completion?.value;
  return `<tr><td>${esc(d.provider)}<div class="hint">${esc(d.model)}</div></td>
    <td>${p == null ? '-' : esc(PRIORITY[Math.round(p)] ?? p)}</td>
    <td>${typeof c === 'number' ? pct(c) : '-'}</td>
    <td>${esc(a.failure_cause?.value ?? '-')}</td>
    <td>${d.provider === 'rules' ? '-' : `${d.latencyMs}ms`}</td></tr>`;
}

  current = id;
  openedAt = performance.now();
  document.querySelectorAll('.item').forEach((el) => el.classList.toggle('active', el.dataset.id === id));
  const { run, prompt, twins, review, decisions, verificationTails, patch, hasRawEvents, dir } = await api(`/api/runs/${encodeURIComponent(id)}`);

  const failed = ['failed', 'timed_out', 'unknown'].includes(run.executionOutcome);
  document.getElementById('detail').innerHTML = `

      ${run.reviewPoints?.length ? `<div class="checklist"><div class="row"><b>리뷰 포인트</b><span class="hint">명령 파일에 적은 확인 항목. 실행기에는 보내지 않았다. 체크는 리뷰와 함께 저장된다(참고용)</span></div>
        ${run.reviewPoints.map((p, i) => `<label><input type="checkbox" data-point="${i}"${review?.checklist?.[i] ? ' checked' : ''}><span>${esc(p)}</span></label>`).join('')}</div>` : ''}

        <select id="cause"><option value="">— 직접 선택 —</option>${meta.causes.map((c) => `<option value="${c}">${c} — ${esc(meta.causeText[c])}</option>`).join('')}</select></div>
      <div class="row"><span class="label" style="min-width:auto">이 화면만으로 결과와 원인을 설명할 수 있었나?</span>
        <button data-explain="true">예</button><button data-explain="false">아니오</button></div>
      <textarea id="note" placeholder="메모 (선택)"></textarea>
      <div class="row" style="margin-top:8px"><button id="submit">리뷰만 저장 후 다음</button>
        <span class="hint" id="formHint">${failed ? '실패한 실행입니다. 원인과 설명 가능 여부가 A0 지표에 들어갑니다.' : ''}</span></div>
      <div id="commitPanel" style="margin-top:10px; border-top:1px solid var(--line); padding-top:10px"><span class="hint">커밋 가능 여부 확인 중…</span></div>
    </section>
    <section>
      <h2>요약 · ${esc(run.id)}</h2>
      <div class="row">${badge(OUTCOME[run.executionOutcome] || [run.executionOutcome, 'b-muted'])}${badge(VERIFY[run.verificationStatus] || [run.verificationStatus, 'b-muted'])}
        ${badge(run.policyStatus === 'clean' ? ['정책 정상', 'b-ok'] : ['정책 ' + run.policyStatus, 'b-bad'])}
        <span class="pill">${esc(run.repo)}</span>${run.tag ? `<span class="pill">#${esc(run.tag)}</span>` : ''}</div>
      <div class="row"><span class="label">실행기</span>${esc(run.agent || 'codex')}${run.agent === 'claude' ? ' <span class="hint">(파일 도구만, 셸·웹 없음, OS 샌드박스 없음)</span>' : ''}${run.fallbackFrom ? ` <span class="hint">← Codex 한도로 자동 전환 (${esc(run.fallbackFrom)})</span>` : ''}${run.autoFallback ? ' <span class="hint">→ 한도로 중단, 자동으로 되돌리고 Claude로 재실행</span>' : ''}</div>
      <div class="row"><span class="label">시간</span>실행 ${secs(run.durations.execMs)} · 검증 ${secs(run.durations.verifyMs)} · ${esc(when(run.startedAt))}</div>
      <div class="row"><span class="label">토큰</span>${u ? `입력 ${num(u.input)} (캐시 ${num(u.cachedInput)}) · 출력 ${num(u.output)}` : '-'}</div>
      ${run.quotaSignalCandidates?.length ? `<div class="row"><span class="label">한도 신호?</span><pre>${esc(run.quotaSignalCandidates.join('\n'))}</pre></div>` : ''}
      ${run.errors?.length ? `<div class="row"><span class="label">오류</span><pre>${esc(run.errors.join('\n'))}</pre></div>` : ''}
    </section>
    ${renderReviewPoints(run, splitPatch(patch), twins || [])}
    <section><h2>작업</h2><pre>${esc(prompt || run.task)}</pre></section>
    <section><h2>실행기의 마지막 메시지 (검증되지 않은 주장)</h2><div class="claim"><pre>${esc(run.lastMessage || '(없음)')}</pre></div></section>
    <section><h2>검증</h2>${run.verification.length ? run.verification.map((v, i) => `
      <div class="row">${badge(VERIFY[v.status] || [v.status, 'b-muted'])}<code>${esc(v.command)}</code><span class="hint">exit ${v.exitCode ?? '-'} · ${secs(v.durationMs)}</span></div>
      ${verificationTails[i] ? `<div class="scroll"><pre>${esc(verificationTails[i])}</pre></div>` : ''}`).join('') : '<span class="hint">설정된 검증 명령 없음</span>'}
      ${run.verifiedTreeChanged ? '<p class="hint">⚠ 검증이 작업 트리를 바꿨습니다. 결과는 검증 전 상태 기준입니다.</p>' : ''}</section>
    <section><h2>변경 (${run.delta.length}파일) <span class="hint">· 파일을 누르면 그 파일의 변경을 보여 줍니다</span></h2>
      <table>${deltaOrder(run.delta).map((i) => { const d = run.delta[i]; return `<tr class="file-row" data-file="${i}"><td>${esc(d.status)}</td><td>${esc(d.path)}</td><td>+${d.add ?? '?'} −${d.del ?? '?'}</td></tr>`; }).join('')}</table>
      <div style="margin-top:8px" id="fileDiff">${run.delta.length ? '' : renderDiff(patch)}</div></section>
    <section><h2>실행한 명령 (${run.commands.length})</h2>
      <table>${run.commands.map((c) => `<tr><td>${c.exit === 0 ? '✓' : `<span style="color:var(--bad)">exit ${esc(c.exit)}</span>`}</td><td><pre>${esc(c.command)}</pre></td></tr>`).join('') || '<tr><td class="hint">없음</td></tr>'}</table></section>
    ${run.denials.length ? `<section><h2>거부된 동작 (${run.denials.length})</h2><table>${run.denials.map((d) => `<tr><td>${esc(d.via)}</td><td><pre>${esc(d.detail)}</pre></td></tr>`).join('')}</table></section>` : ''}
    <section><h2>Shadow 판단 (실행에는 영향 없음)</h2>
      ${review
        ? `<table><tr><th>제공자</th><th>리뷰 우선순위</th><th>완료 확률</th><th>실패 원인</th><th>지연</th></tr>${latestPerProvider(decisions).map(renderDecision).join('') || '<tr><td colspan="5" class="hint">없음</td></tr>'}</table>`
        : `<p class="hint">리뷰를 저장한 뒤에 공개됩니다(${decisions.length}건 기록됨). 리뷰가 판단 제공자를 채점하는 정답이므로, 먼저 보면 판정이 끌려갑니다.</p>`}</section>
    <p class="hint">기록 위치: ${esc(dir)}${hasRawEvents ? ' · 원시 이벤트 보존됨' : ''}</p>`;

  // Per-file diff: clicking a changed file shows only that file's patch; the first file starts selected.
  const chunks = splitPatch(patch);
  // Copy buttons for commands listed under "사람이 할 일" (copy only; nothing is executed from the page).
  const humanCommands = renderReviewPoints.lastCommands || [];
  document.querySelectorAll('.copy-cmd').forEach((b) => b.onclick = async () => {
    try { await navigator.clipboard.writeText(humanCommands[Number(b.dataset.cmd)]); b.textContent = '복사됨'; } catch { b.textContent = '실패'; }
    setTimeout(() => { b.textContent = '복사'; }, 1500);
  });
  const hasHumanTasks = extractSection(run.lastMessage, '사람이 할 일') != null;

  const deltaRows = document.querySelectorAll('.file-row');
  const showFile = (i) => {
    deltaRows.forEach((row) => row.classList.toggle('sel', row.dataset.file === String(i)));
    const d = run.delta[i];
    const chunk = chunks.get(d.path);
    document.getElementById('fileDiff').innerHTML = chunk
      ? renderDiff(chunk)
      : `<span class="hint">${patch ? '이 파일의 diff가 없습니다 (바이너리이거나 잘린 diff).' : 'diff 파일이 없습니다.'}</span>`;
  };
  deltaRows.forEach((row) => row.onclick = () => showFile(Number(row.dataset.file)));
  if (run.delta.length) showFile(deltaOrder(run.delta)[0]);

  const state = { decision: review?.decision || null, explainable: typeof review?.explainable === 'boolean' ? review.explainable : null };
  const causeEl = document.getElementById('cause');
  // No prefill from any provider: the cause label must be the user's own call.
  causeEl.value = review?.cause || '';
  document.getElementById('note').value = review?.reason || '';
  const paint = () => {
    document.querySelectorAll('[data-decision]').forEach((b) => b.className = b.dataset.decision === state.decision ? (state.decision === 'accepted' ? 'sel-ok' : 'sel-bad') : '');
    document.querySelectorAll('[data-explain]').forEach((b) => b.className = String(state.explainable) === b.dataset.explain ? 'sel' : '');
  };
  // Switching the decision must not carry over a cause from the other decision (re-review after a
  // mistaken reject kept "verification_failed" on an accept).
  const syncCause = () => {
    if (state.decision === 'accepted' && review?.decision !== 'accepted') causeEl.value = 'none';
    if (state.decision === 'rejected' && causeEl.value === 'none') causeEl.value = '';
  };
  document.querySelectorAll('[data-decision]').forEach((b) => b.onclick = () => {
    state.decision = b.dataset.decision;
    syncCause();
    paint();
  });
  document.querySelectorAll('[data-explain]').forEach((b) => b.onclick = () => { state.explainable = b.dataset.explain === 'true'; paint(); });
  paint();
  const hint = document.getElementById('formHint');
  const saveReview = async () => {
    if (!state.decision) { hint.textContent = '수락 또는 거절을 선택하세요.'; return false; }
    if (state.explainable == null) { hint.textContent = '설명 가능 여부를 선택하세요.'; return false; }
    if (state.decision === 'accepted' && !causeEl.value) causeEl.value = 'none';
    if (!causeEl.value) { hint.textContent = '거절한 원인을 선택하세요.'; return false; }
    await api(`/api/runs/${encodeURIComponent(run.id)}/review`, { method: 'POST', body: JSON.stringify({
      decision: state.decision, cause: causeEl.value, explainable: state.explainable,
      note: document.getElementById('note').value, viewedMs: performance.now() - openedAt,
      ...(run.reviewPoints?.length ? { checklist: [...document.querySelectorAll('[data-point]')].map((c) => c.checked) } : {}) }) });
    return true;
  };
  const goNext = async () => {
    const next = runs.find((r) => !r.review && r.id !== run.id);
    await loadList(next ? next.id : run.id);
  };
  document.getElementById('submit').onclick = async () => { if (await saveReview()) await goNext(); };

  // Accept-and-commit / reject-and-revert: only this run's files, only if unchanged since the run.
  const panel = document.getElementById('commitPanel');
  const [check, rcheck] = await Promise.all([
    api(`/api/runs/${encodeURIComponent(run.id)}/commit-check`),
    api(`/api/runs/${encodeURIComponent(run.id)}/revert-check`),
  ]);
  if (check.committed) {
    panel.innerHTML = `<span class="done">커밋됨</span> <code>${esc(check.committed.sha.slice(0, 8))}</code> ${esc(check.committed.message)} <span class="hint">(${esc(when(check.committed.at))}, push는 터미널에서)</span>`;
    return;
  }
  if (rcheck.reverted) {
    panel.innerHTML = `<span class="done">되돌림</span> <span class="hint">(${esc(when(rcheck.reverted.at))}) 복원 ${rcheck.reverted.restored.length}개, 삭제 ${rcheck.reverted.removed.length}개</span>`;
    return;
  }
  const issueCell = (issue) => (issue ? `<span style="color:var(--bad)">${esc(issue)}</span>` : '');
  const fileRows = check.files.map((f) => `<tr><td>${esc(f.status)}</td><td>${esc(f.path)}</td><td>${issueCell(f.issue)}</td></tr>`).join('')
    + (check.metas || []).map((m) => `<tr><td class="hint">meta</td><td class="hint">${esc(m)}</td><td class="hint">함께 커밋</td></tr>`).join('');
  const ACTION = { restore: '복원', recreate: '다시 생성', delete: '삭제' };
  const revertRows = rcheck.files.map((f) => `<tr><td>${esc(ACTION[f.action] || f.action)}</td><td>${esc(f.path)}</td><td>${issueCell(f.issue)}</td></tr>`).join('')
    + (rcheck.metas || []).map((m) => `<tr><td class="hint">삭제</td><td class="hint">${esc(m)}</td><td class="hint">Unity meta</td></tr>`).join('');
  panel.innerHTML = `
    <div class="row"><b>수락하고 커밋</b><span class="hint">이 실행이 바꾼 파일과 Unity가 만든 .meta만 커밋합니다. push는 하지 않습니다.</span></div>
    ${hasHumanTasks ? '<div class="hint" style="color:var(--warn)">⚠ 리뷰 요점에 "사람이 할 일"이 있습니다. 처리했는지 확인한 뒤 커밋하세요.</div>' : ''}
    ${fileRows ? `<table>${fileRows}</table>` : ''}
    ${check.problems.map((p) => `<div class="hint" style="color:var(--bad)">${esc(p)}</div>`).join('')}
    <div class="row" style="margin-top:8px"><input id="commitMsg" style="flex:1; min-width:240px; border:1px solid var(--line); border-radius:6px; padding:5px 8px; background:var(--bg)" value="${esc(check.suggestedMessage)}">
      <button class="primary" id="commitBtn" ${check.ok ? '' : 'disabled'}>수락하고 커밋</button></div>
    <div class="hint">커밋 메시지 끝에 <code>Jevcode-Run: ${esc(run.id)}</code>가 붙습니다.</div>
    <div style="margin-top:12px; border-top:1px dashed var(--line); padding-top:10px">
      <div class="row"><b>거절하고 되돌리기</b><span class="hint">이 실행이 바꾼 것만 run 전 상태로 되돌립니다. 이후에 고친 파일은 건드리지 않습니다.</span></div>
      ${revertRows ? `<table>${revertRows}</table>` : ''}
      ${rcheck.problems.map((p) => `<div class="hint" style="color:var(--bad)">${esc(p)}</div>`).join('')}
      <div class="row" style="margin-top:8px"><button id="revertBtn" ${rcheck.ok ? '' : 'disabled'}>거절하고 되돌리기</button>
        <span class="hint">원인과 설명 가능 여부를 먼저 고르세요.</span></div>
    </div>`;
  const revertBtn = document.getElementById('revertBtn');
  if (!rcheck.ok) revertBtn.style.opacity = '0.5';
  revertBtn.onclick = async () => {
    state.decision = 'rejected';
    syncCause();
    paint();
    if (!(await saveReview())) return;
    const result = await api(`/api/runs/${encodeURIComponent(run.id)}/revert`, { method: 'POST', body: '{}' });
    if (!result.ok) {
      hint.textContent = '리뷰는 저장했지만 되돌리지 못했습니다.';
      panel.insertAdjacentHTML('beforeend', result.check.problems.map((p) => `<div class="hint" style="color:var(--bad)">${esc(p)}</div>`).join(''));
      return;
    }
    await goNext();
  };
  const commitBtn = document.getElementById('commitBtn');
  if (!check.ok) commitBtn.style.opacity = '0.5';
  commitBtn.onclick = async () => {
    state.decision = 'accepted';
    syncCause();
    paint();
    if (!(await saveReview())) return;
    const result = await api(`/api/runs/${encodeURIComponent(run.id)}/commit`, { method: 'POST', body: JSON.stringify({ message: document.getElementById('commitMsg').value }) });
    if (!result.ok) {
      hint.textContent = '리뷰는 저장했지만 커밋하지 못했습니다.';
      panel.insertAdjacentHTML('beforeend', result.check.problems.map((p) => `<div class="hint" style="color:var(--bad)">${esc(p)}</div>`).join(''));
      return;
    }
    await goNext();
  };
}

async function showStats() {
  const s = await api('/api/stats');
  const ok = (cond) => (cond == null ? '' : cond ? ' ✓' : ' ✗');
  const evalRows = Object.entries(s.eval).map(([name, e]) => `<tr><td>${esc(name)}</td><td>${e.reviewed}</td>
    <td>${e.brier == null ? '-' : e.brier.toFixed(3)}</td><td>${pct(e.accuracy)}</td>
    <td>${Object.entries(e.byPriority).sort().map(([lvl, v]) => `${PRIORITY[lvl] ?? lvl}: ${v.rejected}/${v.n}`).join(', ') || '-'}</td>
    <td>${Object.entries(e.careByPriority || {}).sort().map(([lvl, v]) => `${PRIORITY[lvl] ?? lvl}: ${v.needCare}/${v.n}`).join(', ') || '-'}</td>
    <td>${pct(e.causeAgreement)} (${e.causeLabeled})</td></tr>`).join('');
  document.getElementById('statsBody').innerHTML = `
    <h3 style="margin-top:0">A0 지표</h3>
    <div class="kpi">
      <div>우회 비율<b>${pct(s.bypassRatio)}${ok(s.bypassRatio == null ? null : s.bypassRatio <= 0.5)}</b><span class="goal">목표 50% 이하 · 실행 ${s.runs} / 직접 ${s.bypasses}</span></div>
      <div>원인 설명 가능<b>${pct(s.explainableRatio)}${ok(s.explainableRatio == null ? null : s.explainableRatio >= 0.7)}</b><span class="goal">목표 70% 이상 · 판정 ${s.explainableJudged} / 대상 ${s.troubled}</span></div>
      <div>리뷰 소요 (중앙값)<b>${secs(s.medianReviewMs)}</b><span class="goal">표본 ${s.reviewTimeSamples}건 · 확인 시간 참고</span></div>
      <div>리뷰 완료<b>${s.reviewed} / ${s.runs}</b><span class="goal">라벨이 Jev 평가의 정답</span></div>
    </div>
    <h3>판단 계층 평가 (설계 10.2)</h3>
    <table><tr><th>제공자</th><th>리뷰됨</th><th>Brier ↓</th><th>정확도</th><th>우선순위별 거절</th><th title="자동 추정: 거절, 설명 불가, 긴 리뷰, 곧바로 같은 파일을 다시 고친 run 중 하나">우선순위별 꼼꼼 필요 (참고)</th><th>원인 일치</th></tr>${evalRows || '<tr><td colspan="7" class="hint">아직 없음</td></tr>'}</table>
    <p class="hint">"꼼꼼 필요"는 추가 입력 없이 기록에서 추정한 참고 지표입니다(거절 · 설명 불가 · 중앙값 2배 이상 리뷰 · 이후 3개 run 안에 같은 파일을 retry/fix). 판정 기준 E1–E4에는 쓰지 않습니다.</p>
    <p class="hint">표본이 작으면 방향성만 봅니다.</p>`;
  document.getElementById('statsDialog').showModal();
}

document.querySelectorAll('[data-filter]').forEach((b) => b.onclick = () => {
  filter = b.dataset.filter;
  document.querySelectorAll('[data-filter]').forEach((x) => x.className = x === b ? 'sel' : '');
  loadList();
});
document.getElementById('reloadBtn').onclick = () => loadList(current);
document.getElementById('statsBtn').onclick = showStats;
document.getElementById('bypassBtn').onclick = () => { document.getElementById('bypassNote').value = ''; document.getElementById('bypassDialog').showModal(); };
document.getElementById('bypassSave').onclick = async () => {
  await api('/api/bypass', { method: 'POST', body: JSON.stringify({ note: document.getElementById('bypassNote').value }) });
  document.getElementById('bypassDialog').close();
};
(async () => { meta = await api('/api/meta'); await loadList(decodeURIComponent(location.hash.slice(1)) || undefined); })().catch((e) => {
  document.getElementById('detail').innerHTML = `<div class="empty">연결 실패: ${esc(e.message)}</div>`;
});
</script>
